<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT — OpenAI Spotlight</title>
  <script src="../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    @font-face { font-family:"JetBrains Mono"; src:url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#080808; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#080808; }

    /* Left logo panel */
    #logo-panel {
      position:absolute; top:0; left:0; width:860px; height:1080px;
      background:linear-gradient(135deg, #0a0a0a 0%, #0f1a15 100%);
    }
    /* Orbit ring centered in left panel: center=(430,540), r=220 */
    #orbit-ring {
      position:absolute; width:440px; height:440px;
      top:320px; left:210px;
      border-radius:50%;
      border:1px solid rgba(16,163,127,0.2);
    }
    #orbit-dot {
      position:absolute; width:12px; height:12px; border-radius:50%;
      background:#10A37F; box-shadow:0 0 18px #10A37F, 0 0 36px rgba(16,163,127,0.5);
      top:-6px; left:214px;
    }
    /* OpenAI 8-dot bloom logo, centered at (430,540) */
    .ld {
      position:absolute; width:18px; height:18px; border-radius:50%;
      background:#fff; box-shadow:0 0 12px rgba(255,255,255,0.4);
    }
    /* 8 dots at r=130 from center (430,540) — panel coords */
    #d0 { top:397px; left:421px; }   /* top          (430,410) */
    #d1 { top:423px; left:513px; }   /* top-right    (522,430) */
    #d2 { top:531px; left:547px; }   /* right        (560,540) */
    #d3 { top:636px; left:513px; }   /* bottom-right (522,650) */
    #d4 { top:662px; left:421px; }   /* bottom       (430,670) */
    #d5 { top:636px; left:328px; }   /* bottom-left  (338,650) */
    #d6 { top:531px; left:295px; }   /* left         (300,540) */
    #d7 { top:423px; left:328px; }   /* top-left     (338,430) */
    #d-center {
      position:absolute; width:30px; height:30px; border-radius:50%;
      background:#fff; top:525px; left:415px;
      box-shadow:0 0 20px rgba(255,255,255,0.6), 0 0 60px rgba(16,163,127,0.3);
    }
    /* OpenAI name tag */
    #oa-label {
      position:absolute; bottom:220px; left:0; width:860px; text-align:center;
      font-family:"JetBrains Mono",monospace; font-size:22px;
      letter-spacing:10px; text-transform:uppercase; color:rgba(16,163,127,0.7);
    }

    /* Vertical divider */
    #divider {
      position:absolute; top:80px; bottom:80px; left:860px;
      width:1px; background:linear-gradient(to bottom,transparent,rgba(255,255,255,0.08),transparent);
    }

    /* Right info card */
    #card {
      position:absolute; top:0; left:920px; right:0; height:1080px;
      display:flex; flex-direction:column; justify-content:center;
      padding:0 80px 0 60px;
    }
    #cat-label {
      font-family:"JetBrains Mono",monospace; font-size:20px;
      letter-spacing:6px; text-transform:uppercase; color:#10A37F; margin-bottom:28px;
    }
    #company { font-size:44px; font-weight:400; color:rgba(255,255,255,0.35); margin-bottom:8px; }
    #product { font-size:148px; font-weight:700; line-height:0.9; color:#fff; margin-bottom:40px; }
    #model-tag {
      display:inline-block; margin-bottom:52px;
      background:rgba(16,163,127,0.12); border:1px solid rgba(16,163,127,0.35);
      border-radius:8px; padding:12px 28px;
      font-family:"JetBrains Mono",monospace; font-size:30px;
      color:#10A37F; letter-spacing:4px;
    }
    .feat {
      display:flex; align-items:center; gap:18px;
      font-size:30px; color:rgba(255,255,255,0.55); margin-bottom:20px;
    }
    .feat-dot { width:7px; height:7px; border-radius:50%; background:#10A37F; flex-shrink:0; }
    #bottom-line {
      position:absolute; bottom:70px; left:920px; right:60px; height:1px;
      background:linear-gradient(to right,rgba(16,163,127,0.5),rgba(16,163,127,0.1));
    }
    /* SVG grid lines in logo panel */
    .ll { position:absolute; }
    #logo-lines {
      position:absolute; top:397px; left:295px; width:270px; height:278px;
      opacity:0.07;
    }
    .vig {
      position:absolute; inset:0; z-index:90; pointer-events:none;
      background:radial-gradient(ellipse 1800px 1000px at center, transparent 40%,rgba(0,0,0,0.6) 100%);
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="clip2-openai" data-width="1920" data-height="1080" data-start="0" data-duration="4">
  <div class="scene clip" id="s1" data-start="0" data-duration="4" data-track-index="0">
    <div id="logo-panel"></div>
    <div id="divider"></div>
    <div id="bottom-line"></div>

    <!-- Logo area -->
    <div id="orbit-ring"><div id="orbit-dot"></div></div>
    <svg id="logo-lines" viewBox="0 0 270 278" xmlns="http://www.w3.org/2000/svg" fill="none">
      <line x1="135" y1="0" x2="135" y2="278" stroke="white" stroke-width="1"/>
      <line x1="0" y1="139" x2="270" y2="139" stroke="white" stroke-width="1"/>
      <line x1="0" y1="0" x2="270" y2="278" stroke="white" stroke-width="1"/>
      <line x1="270" y1="0" x2="0" y2="278" stroke="white" stroke-width="1"/>
    </svg>
    <div class="ld" id="d0"></div><div class="ld" id="d1"></div>
    <div class="ld" id="d2"></div><div class="ld" id="d3"></div>
    <div class="ld" id="d4"></div><div class="ld" id="d5"></div>
    <div class="ld" id="d6"></div><div class="ld" id="d7"></div>
    <div id="d-center"></div>
    <div id="oa-label">OpenAI</div>

    <!-- Info card -->
    <div id="card">
      <div id="cat-label">AI Model · 2025</div>
      <div id="company">OpenAI</div>
      <div id="product">Chat<br>GPT</div>
      <div id="model-tag">GPT-4o</div>
      <div class="feat"><div class="feat-dot"></div>Multimodal — text, vision, voice</div>
      <div class="feat"><div class="feat-dot"></div>128K context window</div>
      <div class="feat"><div class="feat-dot"></div>Real-time reasoning + memory</div>
    </div>
    <div class="vig"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    tl.set("#divider", { scaleY:0, transformOrigin:"top center", autoAlpha:0 }, 0);
    tl.set("#bottom-line", { scaleX:0, transformOrigin:"left center", autoAlpha:0 }, 0);
    tl.set(["#orbit-ring","#d-center","#logo-lines"], { scale:0, autoAlpha:0 }, 0);
    tl.set(".ld", { scale:0, autoAlpha:0 }, 0);
    tl.set("#card", { x:60, autoAlpha:0 }, 0);
    tl.set(["#cat-label","#company","#product","#model-tag"], { y:28, autoAlpha:0 }, 0);
    tl.set(".feat", { x:28, autoAlpha:0 }, 0);
    tl.set("#oa-label", { autoAlpha:0 }, 0);

    /* divider drops */
    tl.to("#divider", { scaleY:1, autoAlpha:1, duration:0.55, ease:"power2.inOut" }, 0);

    /* orbit ring appears */
    tl.to("#orbit-ring", { scale:1, autoAlpha:1, duration:0.4, ease:"back.out(2)" }, 0.1);

    /* orbit ring rotates continuously */
    tl.to("#orbit-ring", { rotation:360, duration:3.5, ease:"none" }, 0.1);

    /* cross lines appear */
    tl.to("#logo-lines", { scale:1, autoAlpha:1, duration:0.3 }, 0.2);

    /* 8 dots spawn in stagger */
    tl.to(".ld", { scale:1, autoAlpha:1, duration:0.22, ease:"back.out(3)", stagger:0.07 }, 0.3);

    /* center dot pulses in */
    tl.to("#d-center", { scale:1, autoAlpha:1, duration:0.35, ease:"elastic.out(1,0.4)" }, 0.95);

    /* OpenAI label */
    tl.to("#oa-label", { autoAlpha:1, duration:0.4 }, 1.2);

    /* card slides in */
    tl.to("#card", { x:0, autoAlpha:1, duration:0.5, ease:"power3.out" }, 0.2);

    /* card text cascade */
    tl.to(["#cat-label","#company","#product","#model-tag"],
      { y:0, autoAlpha:1, duration:0.38, ease:"power2.out", stagger:0.1 }, 0.4);

    /* feature rows slide in */
    tl.to(".feat", { x:0, autoAlpha:1, duration:0.32, ease:"power2.out", stagger:0.09 }, 1.1);

    /* bottom line draws */
    tl.to("#bottom-line", { scaleX:1, autoAlpha:1, duration:0.7, ease:"power2.inOut" }, 1.4);

    /* product text pulse */
    tl.to("#product", { scale:1.02, duration:0.18, ease:"power2.out", transformOrigin:"left center" }, 2.2);
    tl.to("#product", { scale:1, duration:0.22 }, 2.38);

    /* center dot pulse */
    tl.to("#d-center", { scale:1.5, autoAlpha:0.5, duration:0.25, ease:"power2.out" }, 2.5);
    tl.to("#d-center", { scale:1, autoAlpha:1, duration:0.3, ease:"power2.inOut" }, 2.75);

    /* fade out */
    tl.to("#s1", { autoAlpha:0, duration:0.4, ease:"power2.in" }, 3.6);

    window.__timelines["clip2-openai"] = tl;
  </script>
</div>
</body>
</html>
