<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo 2 — Panel Slam</title>
  <script src="../../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../../assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    @font-face { font-family:"JetBrains Mono"; src:url("../../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#060606; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; background:#060606; overflow:hidden; }

    /* ── Panel A: full-bleed dark with big number ── */
    #panel-a {
      position:absolute; inset:0;
      background:#060606;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:24px;
    }
    #pa-eyebrow {
      font-family:"JetBrains Mono",monospace; font-size:20px;
      letter-spacing:10px; text-transform:uppercase; color:rgba(255,255,255,0.35);
    }
    #pa-number {
      font-size:380px; font-weight:700; line-height:1; color:#fff;
      letter-spacing:-20px;
    }
    #pa-unit { color:#00E5FF; }
    #pa-label {
      font-size:52px; font-weight:400; color:rgba(255,255,255,0.5);
      letter-spacing:2px;
    }
    /* Accent bar at bottom of panel A */
    #pa-bar {
      position:absolute; bottom:0; left:0; right:0; height:6px;
      background:linear-gradient(to right, #00E5FF, #7c6cff);
    }

    /* ── Panel B: split left/right ── */
    #panel-b {
      position:absolute; inset:0;
      display:flex;
    }
    #pb-left {
      width:50%; height:100%;
      background:#00E5FF;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; padding:80px;
    }
    #pb-left-label {
      font-size:26px; letter-spacing:6px; text-transform:uppercase;
      color:rgba(0,0,0,0.5); margin-bottom:20px; align-self:flex-start;
    }
    #pb-left-word {
      font-size:160px; font-weight:700; line-height:0.9; color:#000;
      letter-spacing:-4px; align-self:flex-start;
    }
    #pb-right {
      width:50%; height:100%;
      background:#0a0a0a;
      display:flex; align-items:center; justify-content:flex-start;
      flex-direction:column; justify-content:center; padding:80px;
      gap:28px;
    }
    .pb-stat {
      width:100%; display:flex; align-items:center; gap:24px;
    }
    .pb-stat-bar-bg {
      flex:1; height:8px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden;
    }
    .pb-stat-bar-fill {
      height:100%; border-radius:4px; width:0;
    }
    .pb-stat-num {
      font-size:36px; font-weight:700; color:#fff; min-width:80px; text-align:right;
    }
    .pb-stat-name {
      font-family:"JetBrains Mono",monospace; font-size:18px;
      text-transform:uppercase; letter-spacing:4px; color:rgba(255,255,255,0.4);
      width:100%; margin-top:-12px;
    }

    /* ── Panel C: full bleed, big headline, centered ── */
    #panel-c {
      position:absolute; inset:0;
      background:#FF1438;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:32px;
    }
    #pc-top {
      font-family:"JetBrains Mono",monospace; font-size:22px;
      letter-spacing:10px; text-transform:uppercase; color:rgba(0,0,0,0.5);
    }
    #pc-headline {
      font-size:180px; font-weight:700; line-height:0.88;
      color:#000; letter-spacing:-6px; text-align:center;
    }
    #pc-sub {
      font-size:40px; color:rgba(0,0,0,0.55); letter-spacing:2px;
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="demo2" data-width="1920" data-height="1080" data-start="0" data-duration="10">
  <div class="scene clip" id="s1" data-start="0" data-duration="10" data-track-index="0">

    <!-- Panel A -->
    <div id="panel-a">
      <div id="pa-eyebrow">This week in AI</div>
      <div id="pa-number">3<span id="pa-unit">M</span></div>
      <div id="pa-label">new Claude users</div>
      <div id="pa-bar"></div>
    </div>

    <!-- Panel B (hidden initially) -->
    <div id="panel-b">
      <div id="pb-left">
        <div id="pb-left-label">Benchmark</div>
        <div id="pb-left-word">Speed</div>
      </div>
      <div id="pb-right">
        <div class="pb-stat">
          <div class="pb-stat-bar-bg"><div class="pb-stat-bar-fill" id="bar-gpt" style="background:#10A37F;"></div></div>
          <div class="pb-stat-num">84</div>
        </div>
        <div class="pb-stat-name">GPT-4o</div>
        <div class="pb-stat">
          <div class="pb-stat-bar-bg"><div class="pb-stat-bar-fill" id="bar-cl" style="background:#DC5734;"></div></div>
          <div class="pb-stat-num">97</div>
        </div>
        <div class="pb-stat-name">Claude 4</div>
        <div class="pb-stat">
          <div class="pb-stat-bar-bg"><div class="pb-stat-bar-fill" id="bar-gem" style="background:#4285F4;"></div></div>
          <div class="pb-stat-num">91</div>
        </div>
        <div class="pb-stat-name">Gemini 2.5</div>
      </div>
    </div>

    <!-- Panel C (hidden initially) -->
    <div id="panel-c">
      <div id="pc-top">Breaking</div>
      <div id="pc-headline">AGI<br>is<br>close.</div>
      <div id="pc-sub">Sam Altman · May 2025</div>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Initial states
    tl.set("#panel-b", { x:1920, autoAlpha:1 }, 0);
    tl.set("#panel-c", { y:1080, autoAlpha:1 }, 0);
    tl.set(["#pa-eyebrow","#pa-number","#pa-label"], { autoAlpha:0, y:40 }, 0);
    tl.set("#pa-bar", { scaleX:0, transformOrigin:"left center" }, 0);
    tl.set(["#pb-left","#pb-right"], { autoAlpha:0 }, 0);
    tl.set([".pb-stat-bar-fill"], { width:0 }, 0);
    tl.set(["#pc-top","#pc-headline","#pc-sub"], { autoAlpha:0, y:40 }, 0);

    // ── PANEL A: 0–3.2s ──
    tl.to("#pa-eyebrow", { autoAlpha:1, y:0, duration:0.4, ease:"power2.out" }, 0.3);
    tl.to("#pa-number",  { autoAlpha:1, y:0, duration:0.5, ease:"expo.out"  }, 0.5);
    tl.to("#pa-label",   { autoAlpha:1, y:0, duration:0.4, ease:"power2.out" }, 0.8);
    tl.to("#pa-bar", { scaleX:1, duration:0.8, ease:"power2.inOut" }, 1.0);

    // Number counts up: 0 → 3
    tl.fromTo("#pa-number", { innerText:0 }, {
      innerText:3, duration:1.2, ease:"power2.out", snap:{innerText:1},
      onUpdate: function() {
        var el = document.querySelector("#pa-unit");
        if(el) el.style.display = "inline";
      }
    }, 0.5);

    // ── TRANSITION A→B: panel B slams in from right at 3.3s ──
    tl.to("#panel-b", { x:0, duration:0.45, ease:"expo.out" }, 3.3);
    tl.to(["#pb-left","#pb-right"], { autoAlpha:1, duration:0.3, stagger:0.1 }, 3.5);

    // Bars animate
    tl.to("#bar-gpt", { width:"84%", duration:0.7, ease:"power2.out" }, 3.8);
    tl.to("#bar-cl",  { width:"97%", duration:0.7, ease:"power2.out" }, 3.95);
    tl.to("#bar-gem", { width:"91%", duration:0.7, ease:"power2.out" }, 4.1);

    // ── TRANSITION B→C: panel C slams up from bottom at 6.8s ──
    tl.to("#panel-c", { y:0, duration:0.5, ease:"expo.out" }, 6.8);
    tl.to("#pc-top",     { autoAlpha:1, y:0, duration:0.35, ease:"power2.out" }, 7.1);
    tl.to("#pc-headline",{ autoAlpha:1, y:0, duration:0.45, ease:"expo.out"   }, 7.3);
    tl.to("#pc-sub",     { autoAlpha:1, y:0, duration:0.35, ease:"power2.out" }, 7.7);

    // Headline pulse
    tl.to("#pc-headline", { scale:1.03, duration:0.2, ease:"power2.out", transformOrigin:"center" }, 8.4);
    tl.to("#pc-headline", { scale:1,    duration:0.25 }, 8.6);

    // Fade out
    tl.to("#s1", { autoAlpha:0, duration:0.5 }, 9.5);

    window.__timelines["demo2"] = tl;
  </script>
</div>
</body>
</html>
