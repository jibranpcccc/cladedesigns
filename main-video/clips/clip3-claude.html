<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Claude — Anthropic Spotlight</title>
  <script src="../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    @font-face { font-family:"JetBrains Mono"; src:url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#0c0a08; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#0c0a08; }

    /* Background aurora */
    #aurora {
      position:absolute; inset:0;
      background:radial-gradient(ellipse 1200px 600px at 50% 60%,rgba(220,87,52,0.08) 0%,transparent 70%);
    }
    /* Subtle noise grid */
    .grid {
      position:absolute; inset:0;
      background-image:linear-gradient(rgba(220,87,52,0.03) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(220,87,52,0.03) 1px,transparent 1px);
      background-size:100px 100px;
    }

    /* Anthropic "A" logo SVG - centered top area */
    #logo-wrap {
      position:absolute; top:180px; left:50%; margin-left:-180px;
      width:360px; height:360px;
    }

    /* Orbiting particles around logo */
    .p-orbit {
      position:absolute; border-radius:50%;
      background:#DC5734; box-shadow:0 0 12px #DC5734;
    }
    #p1 { width:10px; height:10px; top:-5px; left:175px; }
    #p2 { width:8px; height:8px; top:175px; left:-4px; }
    #p3 { width:6px; height:6px; top:350px; left:178px; }
    #p4 { width:8px; height:8px; top:175px; left:355px; }

    /* Main product name */
    #product-name {
      position:absolute; width:100%; text-align:center;
      top:600px; font-size:200px; font-weight:700; line-height:0.9;
      color:#fff; letter-spacing:-8px;
    }

    /* Version badge */
    #version {
      position:absolute; width:100%; text-align:center; top:800px;
      display:flex; justify-content:center; align-items:center; gap:20px;
    }
    .v-chip {
      display:inline-flex; align-items:center; gap:12px;
      background:rgba(220,87,52,0.12); border:1px solid rgba(220,87,52,0.4);
      border-radius:50px; padding:12px 32px;
      font-family:"JetBrains Mono",monospace; font-size:26px;
      color:#DC5734; letter-spacing:3px;
    }
    .v-dot { width:8px; height:8px; border-radius:50%; background:#DC5734; box-shadow:0 0 10px #DC5734; }

    /* Company name */
    #company {
      position:absolute; width:100%; text-align:center; top:906px;
      font-family:"JetBrains Mono",monospace; font-size:22px;
      letter-spacing:12px; text-transform:uppercase; color:rgba(255,255,255,0.3);
    }

    /* Horizontal rules */
    .rule {
      position:absolute; left:15%; right:15%; height:1px;
      background:linear-gradient(to right,transparent,rgba(220,87,52,0.4),transparent);
    }
    #rule-t { top:172px; }
    #rule-b { top:598px; }
    #rule-bot { top:900px; }

    /* Particle trails */
    .trail {
      position:absolute; height:1px;
      background:linear-gradient(to right,rgba(220,87,52,0),rgba(220,87,52,0.6));
    }
    #trail1 { top:430px; left:0; width:280px; }
    #trail2 { top:630px; right:0; left:auto; width:320px;
      background:linear-gradient(to left,rgba(220,87,52,0),rgba(220,87,52,0.4)); }

    .vig {
      position:absolute; inset:0; z-index:90; pointer-events:none;
      background:radial-gradient(ellipse 1600px 900px at 50% 50%, transparent 30%,rgba(0,0,0,0.8) 100%);
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="clip3-claude" data-width="1920" data-height="1080" data-start="0" data-duration="4">
  <div class="scene clip" id="s1" data-start="0" data-duration="4" data-track-index="0">
    <div id="aurora"></div>
    <div class="grid"></div>
    <div class="rule" id="rule-t"></div>
    <div class="rule" id="rule-b"></div>
    <div class="rule" id="rule-bot"></div>
    <div class="trail" id="trail1"></div>
    <div class="trail" id="trail2"></div>

    <!-- Anthropic A logo -->
    <div id="logo-wrap">
      <div class="p-orbit" id="p1"></div>
      <div class="p-orbit" id="p2"></div>
      <div class="p-orbit" id="p3"></div>
      <div class="p-orbit" id="p4"></div>
      <svg viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg" width="360" height="360">
        <!-- Anthropic-style A mark: two angled bars forming an upward chevron -->
        <polygon id="amark-l" points="60,310 180,60 240,200 195,200 180,155 115,310" fill="#DC5734"/>
        <polygon id="amark-r" points="300,310 180,60 120,200 165,200 180,155 245,310" fill="rgba(220,87,52,0.5)"/>
        <!-- horizontal crossbar -->
        <rect id="abar" x="130" y="212" width="100" height="18" rx="4" fill="#DC5734"/>
        <!-- Glow ring -->
        <circle cx="180" cy="180" r="170" stroke="rgba(220,87,52,0.12)" stroke-width="1"/>
        <circle id="glow-ring" cx="180" cy="180" r="155" stroke="rgba(220,87,52,0.25)" stroke-width="1"/>
      </svg>
    </div>

    <div id="product-name">Claude</div>
    <div id="version">
      <div class="v-chip"><div class="v-dot"></div>Claude 4 Sonnet<div class="v-dot"></div></div>
    </div>
    <div id="company">by Anthropic</div>
    <div class="vig"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    tl.set("#logo-wrap", { scale:0, autoAlpha:0, transformOrigin:"center center" }, 0);
    tl.set(["#amark-l","#amark-r","#abar"], { autoAlpha:0 }, 0);
    tl.set(".p-orbit", { scale:0, autoAlpha:0 }, 0);
    tl.set("#product-name", { y:60, autoAlpha:0 }, 0);
    tl.set(["#version",".v-chip"], { y:30, autoAlpha:0 }, 0);
    tl.set("#company", { autoAlpha:0 }, 0);
    tl.set([".rule","#trail1","#trail2"], { scaleX:0, transformOrigin:"center", autoAlpha:0 }, 0);

    /* rules extend */
    tl.to(".rule", { scaleX:1, autoAlpha:1, duration:0.5, ease:"power2.inOut", stagger:0.1 }, 0);

    /* logo wrapper scales in */
    tl.to("#logo-wrap", { scale:1, autoAlpha:1, duration:0.5, ease:"back.out(1.5)" }, 0.15);

    /* A mark parts appear */
    tl.to(["#amark-l","#abar"], { autoAlpha:1, duration:0.3, ease:"power2.out", stagger:0.08 }, 0.35);
    tl.to("#amark-r", { autoAlpha:1, duration:0.4 }, 0.5);

    /* orbit particles appear and spin */
    tl.to(".p-orbit", { scale:1, autoAlpha:1, duration:0.25, ease:"back.out(3)", stagger:0.08 }, 0.6);
    tl.to("#logo-wrap", { rotation:360, duration:8, ease:"none", transformOrigin:"180px 180px" }, 0.6);

    /* product name rises */
    tl.to("#product-name", { y:0, autoAlpha:1, duration:0.5, ease:"expo.out" }, 0.7);

    /* version chip */
    tl.to("#version", { y:0, autoAlpha:1, duration:0.4, ease:"back.out(2)" }, 1.1);

    /* company */
    tl.to("#company", { autoAlpha:1, duration:0.5 }, 1.4);

    /* trails sweep in */
    tl.to(["#trail1","#trail2"], { scaleX:1, autoAlpha:1, duration:0.6, ease:"power2.out", stagger:0.15 }, 0.5);

    /* glow pulse */
    tl.to("#glow-ring", { attr:{r:165}, opacity:0.5, duration:0.3, ease:"power2.out" }, 2.0);
    tl.to("#glow-ring", { attr:{r:155}, opacity:0.25, duration:0.4, ease:"power2.inOut" }, 2.3);

    /* product text beat */
    tl.to("#product-name", { scale:1.025, duration:0.18, ease:"power2.out", transformOrigin:"center top" }, 2.5);
    tl.to("#product-name", { scale:1, duration:0.25 }, 2.68);

    /* aurora pulses */
    tl.to("#aurora", { scale:1.2, duration:0.8, ease:"power1.inOut" }, 2.2);
    tl.to("#aurora", { scale:1, duration:0.8, ease:"power1.inOut" }, 3.0);

    /* fade out */
    tl.to("#s1", { autoAlpha:0, duration:0.4, ease:"power2.in" }, 3.6);

    window.__timelines["clip3-claude"] = tl;
  </script>
</div>
</body>
</html>
