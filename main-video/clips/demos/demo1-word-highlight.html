<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo 1 — Word Highlight Block</title>
  <script src="../../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../../assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#0a0a0a; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; background:#0a0a0a; overflow:hidden; }

    /* Each "line" is a row of words */
    .line {
      position:absolute; left:160px;
      display:flex; align-items:center; gap:0;
    }
    #line1 { top:260px; }
    #line2 { top:400px; }
    #line3 { top:540px; }
    #line4 { top:680px; }

    /* Each word is a span with padding so the highlight block fits snugly */
    .w {
      display:inline-block;
      font-size:110px; font-weight:700; line-height:1;
      color:#fff; padding:0 18px;
      position:relative; z-index:2;
    }
    .w.dim { color:rgba(255,255,255,0.18); }

    /* The moving highlight block — absolutely positioned, moves via GSAP x/width */
    .hl-block {
      position:absolute;
      top:0; left:0;
      height:100%;
      border-radius:8px;
      z-index:1;
    }
    #hl1 { background:#00E5FF; top:260px; height:128px; }
    #hl2 { background:#FF1438; top:400px; height:128px; }
    #hl3 { background:#7c6cff; top:540px; height:128px; }
    #hl4 { background:#FFBB00; top:680px; height:128px; }

    /* Label */
    #label {
      position:absolute; top:80px; left:160px;
      font-size:22px; letter-spacing:8px; text-transform:uppercase;
      color:rgba(255,255,255,0.3);
    }

    /* Bottom line */
    #bline {
      position:absolute; bottom:100px; left:160px; right:160px; height:1px;
      background:linear-gradient(to right,rgba(255,255,255,0.15),transparent);
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="demo1" data-width="1920" data-height="1080" data-start="0" data-duration="10">
  <div class="scene clip" id="s1" data-start="0" data-duration="10" data-track-index="0">

    <div id="label">AI Pulse — Motion Demo 01</div>
    <div id="bline"></div>

    <!-- Moving highlight blocks -->
    <div class="hl-block" id="hl1"></div>
    <div class="hl-block" id="hl2"></div>
    <div class="hl-block" id="hl3"></div>
    <div class="hl-block" id="hl4"></div>

    <!-- Line 1 -->
    <div class="line" id="line1">
      <span class="w dim" id="w1-1">Open</span>
      <span class="w dim" id="w1-2">source</span>
      <span class="w dim" id="w1-3">AI</span>
      <span class="w dim" id="w1-4">is</span>
      <span class="w dim" id="w1-5">winning.</span>
    </div>

    <!-- Line 2 -->
    <div class="line" id="line2">
      <span class="w dim" id="w2-1">Models</span>
      <span class="w dim" id="w2-2">are</span>
      <span class="w dim" id="w2-3">getting</span>
      <span class="w dim" id="w2-4">faster.</span>
    </div>

    <!-- Line 3 -->
    <div class="line" id="line3">
      <span class="w dim" id="w3-1">Costs</span>
      <span class="w dim" id="w3-2">are</span>
      <span class="w dim" id="w3-3">dropping</span>
      <span class="w dim" id="w3-4">fast.</span>
    </div>

    <!-- Line 4 -->
    <div class="line" id="line4">
      <span class="w dim" id="w4-1">This</span>
      <span class="w dim" id="w4-2">week</span>
      <span class="w dim" id="w4-3">changes</span>
      <span class="w dim" id="w4-4">everything.</span>
    </div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Helper: get element's left offset relative to #root
    function rx(el) { return el.getBoundingClientRect().left; }
    function rw(el) { return el.getBoundingClientRect().width; }

    // Initial: all highlight blocks hidden (width:0, off-screen left)
    tl.set(["#hl1","#hl2","#hl3","#hl4"], { width:0, x:-20, autoAlpha:0 }, 0);
    tl.set(".w", { autoAlpha:0 }, 0);
    tl.set("#label,#bline", { autoAlpha:0 }, 0);

    // Label fades in
    tl.to("#label", { autoAlpha:1, duration:0.5 }, 0.2);
    tl.to("#bline", { autoAlpha:1, duration:0.5 }, 0.2);

    // ── LINE 1 words appear, then highlight block sweeps word by word ──
    // Words appear all at once first (dim)
    tl.to("#line1 .w", { autoAlpha:1, duration:0.3, stagger:0.05 }, 0.5);

    // hl1 appears, jumps to each word
    // Word positions (approx, measured as offsets within the line):
    // w1-1: x=160, w=~230  w1-2: x=~408, w=~230  w1-3: x=~656, w=~100  w1-4: x=~756, w=~70  w1-5: x=~844, w=~280
    // We'll use CSS left offsets. Since words are in a flex row starting at left:160px,
    // we animate the block's x and width to match each word's position.
    // Measured padding:18px on each side, font-size 110px ≈ char ~66px wide

    var words1 = [
      { id:"#w1-1", bright: true },
      { id:"#w1-2", bright: true },
      { id:"#w1-3", bright: true },
      { id:"#w1-4", bright: true },
      { id:"#w1-5", bright: true },
    ];

    // Animate hl1 appearing and snapping to each word
    tl.to("#hl1", { autoAlpha:1, duration:0.1 }, 0.8);

    var t = 0.8;
    var wordEls1 = ["#w1-1","#w1-2","#w1-3","#w1-4","#w1-5"];
    wordEls1.forEach(function(wid, i) {
      // Snap block to this word (use onStart to measure and set)
      tl.call(function(id) {
        var el = document.querySelector(id);
        var lineEl = document.querySelector("#line1");
        var lineLeft = lineEl.getBoundingClientRect().left;
        var elRect = el.getBoundingClientRect();
        gsap.set("#hl1", { x: elRect.left, width: elRect.width });
        // Brighten this word
        gsap.set(id, { color: "#0a0a0a" });
      }, [wid], t);
      // Hold for ~0.35s per word
      t += 0.38;
    });

    // After all words, fade line 1 block
    tl.to("#hl1", { autoAlpha:0, duration:0.2 }, t);
    tl.to("#line1 .w", { color:"#fff", duration:0.2 }, t);

    // ── LINE 2 ──
    var t2 = t + 0.1;
    tl.to("#line2 .w", { autoAlpha:1, duration:0.3, stagger:0.04 }, t2);
    tl.to("#hl2", { autoAlpha:1, duration:0.1 }, t2 + 0.25);
    var t2w = t2 + 0.25;
    ["#w2-1","#w2-2","#w2-3","#w2-4"].forEach(function(wid) {
      tl.call(function(id) {
        var el = document.querySelector(id);
        var elRect = el.getBoundingClientRect();
        gsap.set("#hl2", { x: elRect.left, width: elRect.width });
        gsap.set(id, { color:"#0a0a0a" });
      }, [wid], t2w);
      t2w += 0.38;
    });
    tl.to("#hl2", { autoAlpha:0, duration:0.2 }, t2w);
    tl.to("#line2 .w", { color:"#fff", duration:0.2 }, t2w);

    // ── LINE 3 ──
    var t3 = t2w + 0.1;
    tl.to("#line3 .w", { autoAlpha:1, duration:0.3, stagger:0.04 }, t3);
    tl.to("#hl3", { autoAlpha:1, duration:0.1 }, t3 + 0.25);
    var t3w = t3 + 0.25;
    ["#w3-1","#w3-2","#w3-3","#w3-4"].forEach(function(wid) {
      tl.call(function(id) {
        var el = document.querySelector(id);
        var elRect = el.getBoundingClientRect();
        gsap.set("#hl3", { x: elRect.left, width: elRect.width });
        gsap.set(id, { color:"#0a0a0a" });
      }, [wid], t3w);
      t3w += 0.38;
    });
    tl.to("#hl3", { autoAlpha:0, duration:0.2 }, t3w);
    tl.to("#line3 .w", { color:"#fff", duration:0.2 }, t3w);

    // ── LINE 4 ──
    var t4 = t3w + 0.1;
    tl.to("#line4 .w", { autoAlpha:1, duration:0.3, stagger:0.04 }, t4);
    tl.to("#hl4", { autoAlpha:1, duration:0.1 }, t4 + 0.25);
    var t4w = t4 + 0.25;
    ["#w4-1","#w4-2","#w4-3","#w4-4"].forEach(function(wid) {
      tl.call(function(id) {
        var el = document.querySelector(id);
        var elRect = el.getBoundingClientRect();
        gsap.set("#hl4", { x: elRect.left, width: elRect.width });
        gsap.set(id, { color:"#0a0a0a" });
      }, [wid], t4w);
      t4w += 0.38;
    });
    tl.to("#hl4", { autoAlpha:0, duration:0.2 }, t4w);
    tl.to("#line4 .w", { color:"#fff", duration:0.2 }, t4w);

    // Fade out
    tl.to("#s1", { autoAlpha:0, duration:0.5 }, 9.5);

    window.__timelines["demo1"] = tl;
  </script>
</div>
</body>
</html>
