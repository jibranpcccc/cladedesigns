<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Gemini Spotlight</title>
  <script src="../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    @font-face { font-family:"JetBrains Mono"; src:url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#04060d; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#04060d; }

    /* deep space bg */
    #bg-glow {
      position:absolute; inset:0;
      background:
        radial-gradient(ellipse 800px 400px at 50% 35%, rgba(66,133,244,0.08) 0%,transparent 70%),
        radial-gradient(ellipse 600px 300px at 30% 70%, rgba(234,67,53,0.06) 0%,transparent 70%),
        radial-gradient(ellipse 600px 300px at 70% 70%, rgba(52,168,83,0.06) 0%,transparent 70%);
    }

    /* Stars */
    .star {
      position:absolute; border-radius:50%; background:#fff;
    }
    #st1 { width:2px; height:2px; top:120px; left:300px; opacity:0.4; }
    #st2 { width:1px; height:1px; top:80px; left:800px; opacity:0.6; }
    #st3 { width:2px; height:2px; top:200px; left:1500px; opacity:0.3; }
    #st4 { width:1px; height:1px; top:900px; left:400px; opacity:0.5; }
    #st5 { width:2px; height:2px; top:60px; left:1200px; opacity:0.4; }
    #st6 { width:1px; height:1px; top:950px; left:1700px; opacity:0.6; }
    #st7 { width:2px; height:2px; top:700px; left:100px; opacity:0.3; }
    #st8 { width:1px; height:1px; top:400px; left:1850px; opacity:0.5; }

    /* Gemini 4-pointed star — centered */
    #star-wrap {
      position:absolute; top:80px; left:50%; margin-left:-260px;
      width:520px; height:520px;
    }

    /* Color rings */
    .cring {
      position:absolute; border-radius:50%; top:50%; left:50%; border-width:1px; border-style:solid;
    }
    #cr-blue  { width:540px; height:540px; margin:-270px 0 0 -270px; border-color:rgba(66,133,244,0.2); }
    #cr-red   { width:480px; height:480px; margin:-240px 0 0 -240px; border-color:rgba(234,67,53,0.15); }
    #cr-green { width:420px; height:420px; margin:-210px 0 0 -210px; border-color:rgba(52,168,83,0.15); }
    #cr-yellow{ width:360px; height:360px; margin:-180px 0 0 -180px; border-color:rgba(251,188,4,0.15); }

    /* Gemini name */
    #product-name {
      position:absolute; width:100%; text-align:center;
      top:656px; font-size:210px; font-weight:700; line-height:1;
      background:linear-gradient(90deg, #4285F4 0%, #EA4335 33%, #34A853 66%, #FBBC04 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text; letter-spacing:-6px;
    }

    /* Google label */
    #google-label {
      position:absolute; width:100%; text-align:center; top:874px;
      font-family:"JetBrains Mono",monospace; font-size:22px;
      letter-spacing:12px; text-transform:uppercase;
      color:rgba(255,255,255,0.3);
    }

    /* Model badges row */
    #badges {
      position:absolute; width:100%; top:940px;
      display:flex; justify-content:center; gap:20px;
    }
    .badge {
      padding:8px 24px; border-radius:30px;
      font-family:"JetBrains Mono",monospace; font-size:18px; letter-spacing:2px;
    }
    #b1 { background:rgba(66,133,244,0.15); border:1px solid rgba(66,133,244,0.4); color:#4285F4; }
    #b2 { background:rgba(234,67,53,0.15); border:1px solid rgba(234,67,53,0.4); color:#EA4335; }
    #b3 { background:rgba(52,168,83,0.15); border:1px solid rgba(52,168,83,0.4); color:#34A853; }
    #b4 { background:rgba(251,188,4,0.15); border:1px solid rgba(251,188,4,0.4); color:#FBBC04; }

    /* Orbit dot */
    #orbit-ring-g {
      position:absolute; width:580px; height:580px;
      top:50px; left:50%; margin-left:-290px;
      border-radius:50%; border:1px solid rgba(66,133,244,0.12);
    }
    #orbit-dot-g {
      position:absolute; width:10px; height:10px; border-radius:50%;
      background:#4285F4; box-shadow:0 0 14px #4285F4;
      top:-5px; left:285px;
    }

    .vig {
      position:absolute; inset:0; z-index:90; pointer-events:none;
      background:radial-gradient(ellipse 1600px 900px at center, transparent 35%,rgba(0,0,0,0.85) 100%);
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="clip4-gemini" data-width="1920" data-height="1080" data-start="0" data-duration="4">
  <div class="scene clip" id="s1" data-start="0" data-duration="4" data-track-index="0">
    <div id="bg-glow"></div>
    <div class="star" id="st1"></div><div class="star" id="st2"></div>
    <div class="star" id="st3"></div><div class="star" id="st4"></div>
    <div class="star" id="st5"></div><div class="star" id="st6"></div>
    <div class="star" id="st7"></div><div class="star" id="st8"></div>

    <div class="cring" id="cr-blue"></div>
    <div class="cring" id="cr-red"></div>
    <div class="cring" id="cr-green"></div>
    <div class="cring" id="cr-yellow"></div>

    <div id="orbit-ring-g"><div id="orbit-dot-g"></div></div>

    <!-- Gemini 4-pointed star SVG -->
    <div id="star-wrap">
      <svg viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg" width="520" height="520">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#4285F4"/>
            <stop offset="33%" stop-color="#EA4335"/>
            <stop offset="66%" stop-color="#34A853"/>
            <stop offset="100%" stop-color="#FBBC04"/>
          </linearGradient>
          <filter id="glow-f">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <!-- 4-pointed star: M cx,top C ... right ... bottom ... left ... top Z -->
        <path id="star-path"
          d="M260,20 C260,140 380,260 500,260 C380,260 260,380 260,500 C260,380 140,260 20,260 C140,260 260,140 260,20 Z"
          fill="url(#sg)" filter="url(#glow-f)"/>
        <!-- Inner glow star (smaller, brighter) -->
        <path id="star-inner"
          d="M260,100 C260,190 330,260 420,260 C330,260 260,330 260,420 C260,330 190,260 100,260 C190,260 260,190 260,100 Z"
          fill="white" opacity="0.15"/>
      </svg>
    </div>

    <div id="product-name">Gemini</div>
    <div id="google-label">by Google DeepMind</div>
    <div id="badges">
      <div class="badge" id="b1">Ultra</div>
      <div class="badge" id="b2">Pro</div>
      <div class="badge" id="b3">Flash</div>
      <div class="badge" id="b4">Nano</div>
    </div>
    <div class="vig"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    tl.set(".cring", { scale:0, autoAlpha:0 }, 0);
    tl.set("#orbit-ring-g", { scale:0, autoAlpha:0 }, 0);
    tl.set("#star-wrap", { scale:0, autoAlpha:0, rotation:45, transformOrigin:"260px 260px" }, 0);
    tl.set(["#star-path","#star-inner"], { scale:0, autoAlpha:0, transformOrigin:"260px 260px" }, 0);
    tl.set("#product-name", { y:50, autoAlpha:0 }, 0);
    tl.set(["#google-label","#badges"], { autoAlpha:0 }, 0);
    tl.set(".badge", { y:20, autoAlpha:0 }, 0);
    tl.set(".star", { autoAlpha:0 }, 0);

    /* stars twinkle in */
    tl.to(".star", { autoAlpha:1, duration:0.4, stagger:0.06 }, 0);

    /* color rings burst out */
    tl.to(".cring", { scale:1, autoAlpha:1, duration:0.6, ease:"back.out(1.5)", stagger:0.06 }, 0.1);

    /* orbit ring appears and spins */
    tl.to("#orbit-ring-g", { scale:1, autoAlpha:1, duration:0.3, ease:"back.out(2)" }, 0.2);
    tl.to("#orbit-ring-g", { rotation:360, duration:3.5, ease:"none" }, 0.2);

    /* star rotates in */
    tl.to("#star-wrap", { scale:1, autoAlpha:1, rotation:0, duration:0.6, ease:"back.out(1.5)" }, 0.3);
    tl.to(["#star-path","#star-inner"], { scale:1, autoAlpha:1, duration:0.5, ease:"expo.out" }, 0.35);

    /* continuous star rotation */
    tl.to("#star-wrap", { rotation:360, duration:8, ease:"none", transformOrigin:"260px 260px" }, 0.9);

    /* product name slides up */
    tl.to("#product-name", { y:0, autoAlpha:1, duration:0.55, ease:"expo.out" }, 0.7);

    /* Google label */
    tl.to("#google-label", { autoAlpha:1, duration:0.45 }, 1.1);

    /* badges stagger */
    tl.to(".badge", { y:0, autoAlpha:1, duration:0.3, ease:"back.out(2)", stagger:0.07 }, 1.3);

    /* star pulse */
    tl.to("#star-wrap", { scale:1.08, duration:0.25, ease:"power2.out", transformOrigin:"260px 260px" }, 2.2);
    tl.to("#star-wrap", { scale:1, duration:0.3, ease:"power2.inOut" }, 2.45);

    /* color rings pulse */
    tl.to(".cring", { scale:1.05, opacity:0.5, duration:0.3, ease:"power2.out", stagger:0.04 }, 2.8);
    tl.to(".cring", { scale:1, opacity:1, duration:0.35, ease:"power2.inOut", stagger:0.04 }, 3.1);

    /* fade out */
    tl.to("#s1", { autoAlpha:0, duration:0.4, ease:"power2.in" }, 3.6);

    window.__timelines["clip4-gemini"] = tl;
  </script>
</div>
</body>
</html>
