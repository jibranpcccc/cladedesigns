<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI PULSE — Channel Ident</title>
  <script src="../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../assets/fonts/space-grotesk-latin-300-normal.woff2") format("woff2"); font-weight:300; }
    @font-face { font-family:"JetBrains Mono"; src:url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#000; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:#020206; }
    .grid {
      position:absolute; inset:0;
      background-image: linear-gradient(rgba(0,229,255,0.04) 1px,transparent 1px), linear-gradient(90deg,rgba(0,229,255,0.04) 1px,transparent 1px);
      background-size:120px 120px;
    }
    #scan {
      position:absolute; top:0; width:3px; height:1080px; left:0;
      background:linear-gradient(to bottom,transparent,#00E5FF 40%,#00E5FF 60%,transparent);
      box-shadow:0 0 24px #00E5FF, 0 0 80px rgba(0,229,255,0.35);
      z-index:30;
    }
    .ring {
      position:absolute; border-radius:50%; top:50%; left:50%;
    }
    #r1 { width:360px; height:360px; margin:-180px 0 0 -180px; border:1px solid #00E5FF; }
    #r2 { width:680px; height:680px; margin:-340px 0 0 -340px; border:1px solid rgba(255,0,128,0.5); }
    #r3 { width:1020px; height:1020px; margin:-510px 0 0 -510px; border:1px solid rgba(0,229,255,0.18); }
    #word-ai {
      position:absolute; width:100%; text-align:center;
      top:140px; font-size:560px; font-weight:700; line-height:1; letter-spacing:-20px;
    }
    .ltr-a { color:#fff; }
    .ltr-i { color:#00E5FF; text-shadow:0 0 80px rgba(0,229,255,0.9),0 0 140px rgba(0,229,255,0.4); }
    #word-pulse {
      position:absolute; width:100%; text-align:center;
      top:826px; font-size:90px; font-weight:300; letter-spacing:56px; color:#FF0080;
      display:flex; justify-content:center;
    }
    .ch { display:inline-block; }
    #tagline {
      position:absolute; width:100%; text-align:center; bottom:38px;
      font-family:"JetBrains Mono",monospace; font-size:20px; letter-spacing:10px;
      text-transform:uppercase; color:rgba(255,255,255,0.28);
    }
    .hbar {
      position:absolute; left:8%; right:8%; height:1px;
      background:linear-gradient(to right,transparent,rgba(0,229,255,0.55),rgba(255,0,128,0.55),transparent);
    }
    #hbar-t { top:130px; }
    #hbar-b { top:818px; }
    #corner-tl, #corner-tr, #corner-bl, #corner-br {
      position:absolute; width:40px; height:40px;
    }
    #corner-tl { top:60px; left:80px; border-top:2px solid #00E5FF; border-left:2px solid #00E5FF; }
    #corner-tr { top:60px; right:80px; border-top:2px solid #00E5FF; border-right:2px solid #00E5FF; }
    #corner-bl { bottom:60px; left:80px; border-bottom:2px solid #FF0080; border-left:2px solid #FF0080; }
    #corner-br { bottom:60px; right:80px; border-bottom:2px solid #FF0080; border-right:2px solid #FF0080; }
    #glitch { position:absolute; inset:0; z-index:50; background:#00E5FF; mix-blend-mode:overlay; pointer-events:none; }
    .vig {
      position:absolute; inset:0; z-index:90; pointer-events:none;
      background:radial-gradient(ellipse 1400px 800px at center, transparent 20%,rgba(0,0,0,0.88) 100%);
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="clip1-ident" data-width="1920" data-height="1080" data-start="0" data-duration="4">
  <div class="scene clip" id="s1" data-start="0" data-duration="4" data-track-index="0">
    <div class="grid"></div>
    <div id="glitch"></div>
    <div class="ring" id="r1"></div>
    <div class="ring" id="r2"></div>
    <div class="ring" id="r3"></div>
    <div class="hbar" id="hbar-t"></div>
    <div class="hbar" id="hbar-b"></div>
    <div id="corner-tl"></div><div id="corner-tr"></div>
    <div id="corner-bl"></div><div id="corner-br"></div>
    <div id="scan"></div>
    <div id="word-ai"><span class="ltr-a">A</span><span class="ltr-i">I</span></div>
    <div id="word-pulse">
      <span class="ch">P</span><span class="ch">U</span><span class="ch">L</span><span class="ch">S</span><span class="ch">E</span>
    </div>
    <div id="tagline">Your daily AI intelligence feed</div>
    <div class="vig"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    tl.set(["#r1","#r2","#r3"], { scale:0, autoAlpha:0 }, 0);
    tl.set("#scan", { x:-3 }, 0);
    tl.set("#word-ai", { scale:4, autoAlpha:0 }, 0);
    tl.set("#word-pulse .ch", { y:70, autoAlpha:0 }, 0);
    tl.set(["#tagline","#glitch"], { autoAlpha:0 }, 0);
    tl.set(["#hbar-t","#hbar-b"], { scaleX:0, transformOrigin:"center", autoAlpha:0 }, 0);
    tl.set(["#corner-tl","#corner-tr","#corner-bl","#corner-br"], { scale:0, autoAlpha:0 }, 0);

    /* scan sweep */
    tl.to("#scan", { x:1923, duration:0.42, ease:"power3.inOut" }, 0);

    /* rings burst outward */
    tl.to(["#r1","#r2","#r3"], { autoAlpha:1, duration:0.01 }, 0.06);
    tl.to("#r1", { scale:5, autoAlpha:0, duration:1.4, ease:"power2.out" }, 0.06);
    tl.to("#r2", { scale:4, autoAlpha:0, duration:1.8, ease:"power2.out" }, 0.14);
    tl.to("#r3", { scale:3, autoAlpha:0, duration:2.2, ease:"power2.out" }, 0.22);

    /* corner brackets appear */
    tl.to(["#corner-tl","#corner-tr","#corner-bl","#corner-br"],
      { scale:1, autoAlpha:1, duration:0.35, ease:"back.out(3)", stagger:0.06 }, 0.15);

    /* horizontal bars */
    tl.to(["#hbar-t","#hbar-b"], { scaleX:1, autoAlpha:1, duration:0.45, ease:"power2.inOut", stagger:0.08 }, 0.22);

    /* AI slams in */
    tl.to("#word-ai", { scale:1, autoAlpha:1, duration:0.44, ease:"expo.out" }, 0.28);

    /* PULSE letters stagger up */
    tl.to("#word-pulse .ch", { y:0, autoAlpha:1, duration:0.38, ease:"back.out(2.5)", stagger:0.055 }, 1.0);

    /* tagline */
    tl.to("#tagline", { autoAlpha:1, duration:0.55 }, 1.55);

    /* second scan sweep */
    tl.set("#scan", { x:-3 }, 1.9);
    tl.to("#scan", { x:1923, duration:0.48, ease:"power2.inOut" }, 1.9);

    /* AI text beat */
    tl.to("#word-ai", { scale:1.018, duration:0.14, ease:"power2.out" }, 2.22);
    tl.to("#word-ai", { scale:1, duration:0.22 }, 2.36);

    /* glitch flash */
    tl.to("#glitch", { autoAlpha:0.48, duration:0.04 }, 2.75);
    tl.to("#glitch", { autoAlpha:0, duration:0.04 }, 2.79);
    tl.to("#glitch", { autoAlpha:0.22, duration:0.04 }, 2.83);
    tl.to("#glitch", { autoAlpha:0, duration:0.04 }, 2.87);

    /* rings pulse again */
    tl.set(["#r1","#r2"], { scale:0, autoAlpha:1 }, 3.0);
    tl.to("#r1", { scale:4, autoAlpha:0, duration:0.8, ease:"power2.out" }, 3.0);
    tl.to("#r2", { scale:3.5, autoAlpha:0, duration:1.0, ease:"power2.out" }, 3.1);

    /* fade out */
    tl.to("#s1", { autoAlpha:0, duration:0.4, ease:"power2.in" }, 3.6);

    window.__timelines["clip1-ident"] = tl;
  </script>
</div>
</body>
</html>
