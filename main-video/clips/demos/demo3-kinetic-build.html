<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo 3 — Kinetic Word Build</title>
  <script src="../../assets/js/gsap.min.js"></script>
  <style>
    @font-face { font-family:"Space Grotesk"; src:url("../../assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight:700; }
    @font-face { font-family:"Space Grotesk"; src:url("../../assets/fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    @font-face { font-family:"JetBrains Mono"; src:url("../../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); font-weight:400; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body, html { width:1920px; height:1080px; overflow:hidden; background:#07080f; font-family:"Space Grotesk",sans-serif; }
    #root { position:relative; width:1920px; height:1080px; background:#07080f; overflow:hidden; }

    /* Background grid */
    .grid {
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(124,108,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,108,255,0.04) 1px, transparent 1px);
      background-size:80px 80px;
    }

    /* Stage 1: sentence builds word by word */
    #stage1 {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      justify-content:center; padding:0 160px;
      gap:0;
    }
    #s1-eyebrow {
      font-family:"JetBrains Mono",monospace; font-size:22px;
      letter-spacing:8px; text-transform:uppercase; color:rgba(124,108,255,0.7);
      margin-bottom:40px;
    }
    #s1-words {
      display:flex; flex-wrap:wrap; gap:0 12px; align-items:baseline;
    }
    .kw {
      font-size:130px; font-weight:700; line-height:1.05;
      color:rgba(255,255,255,0.15);
      display:inline-block;
      position:relative;
    }
    /* The colored box that reveals behind a keyword */
    .kw-box {
      position:absolute;
      bottom:8px; left:-6px; right:-6px;
      height:12px; border-radius:3px;
      transform-origin:left center;
    }
    #box-hermes { background:#7c6cff; bottom:8px; }
    #box-memory { background:#00E5FF; }
    #box-runs   { background:#FF1438; }

    /* Stage 2: stat card wipe in */
    #stage2 {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
    }
    #stat-card {
      width:900px;
      background:rgba(124,108,255,0.08);
      border:1px solid rgba(124,108,255,0.25);
      border-radius:16px;
      padding:70px 80px;
      position:relative; overflow:hidden;
    }
    /* Clip-path wipe — card reveals left to right */
    #stat-card-inner {
      width:100%;
    }
    #sc-label {
      font-family:"JetBrains Mono",monospace; font-size:20px;
      letter-spacing:6px; text-transform:uppercase; color:rgba(124,108,255,0.7);
      margin-bottom:30px;
    }
    #sc-big {
      font-size:240px; font-weight:700; line-height:1; color:#fff;
      letter-spacing:-10px; margin-bottom:16px;
    }
    #sc-big span { color:#7c6cff; }
    #sc-desc {
      font-size:40px; color:rgba(255,255,255,0.4); letter-spacing:1px;
    }
    /* Card shine bar — sweeps left to right */
    #card-shine {
      position:absolute; top:0; left:0; width:60px; height:100%;
      background:linear-gradient(90deg, transparent, rgba(124,108,255,0.15), transparent);
    }

    /* Stage 3: final takeover word */
    #stage3 {
      position:absolute; inset:0;
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:20px;
    }
    #s3-bg-block {
      position:absolute; inset:0;
      background:#7c6cff;
    }
    #s3-word {
      font-size:400px; font-weight:700; line-height:1;
      color:#000; letter-spacing:-20px; position:relative; z-index:2;
    }
    #s3-sub {
      font-family:"JetBrains Mono",monospace; font-size:28px;
      letter-spacing:12px; text-transform:uppercase;
      color:rgba(0,0,0,0.45); position:relative; z-index:2;
    }

    .vig {
      position:absolute; inset:0; z-index:90; pointer-events:none;
      background:radial-gradient(ellipse 1600px 900px at center, transparent 30%,rgba(0,0,0,0.7) 100%);
    }
  </style>
</head>
<body>
<div id="root" data-composition-id="demo3" data-width="1920" data-height="1080" data-start="0" data-duration="10">
  <div class="scene clip" id="sc1" data-start="0" data-duration="10" data-track-index="0">
    <div class="grid"></div>

    <!-- Stage 1: kinetic word build -->
    <div id="stage1">
      <div id="s1-eyebrow">AI Pulse · Weekly Digest</div>
      <div id="s1-words">
        <span class="kw" id="kw-hermes">Hermes<div class="kw-box" id="box-hermes"></div></span>
        <span class="kw" id="kw-has">has</span>
        <span class="kw" id="kw-persistent">persistent</span>
        <span class="kw" id="kw-memory">memory<div class="kw-box" id="box-memory"></div></span>
        <span class="kw" id="kw-and">and</span>
        <span class="kw" id="kw-runs">runs<div class="kw-box" id="box-runs"></div></span>
        <span class="kw" id="kw-locally">locally.</span>
      </div>
    </div>

    <!-- Stage 2: stat card -->
    <div id="stage2">
      <div id="stat-card">
        <div id="card-shine"></div>
        <div id="stat-card-inner">
          <div id="sc-label">Context window</div>
          <div id="sc-big">200<span>K</span></div>
          <div id="sc-desc">tokens — fits your entire codebase</div>
        </div>
      </div>
    </div>

    <!-- Stage 3: takeover -->
    <div id="stage3">
      <div id="s3-bg-block"></div>
      <div id="s3-word">Open.</div>
      <div id="s3-sub">Nous Research · Apache 2.0 License</div>
    </div>

    <div class="vig"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // ── Initial states ──
    tl.set("#stage2,#stage3", { autoAlpha:0 }, 0);
    tl.set("#s1-eyebrow", { autoAlpha:0, x:-30 }, 0);
    tl.set(".kw", { autoAlpha:0, y:50 }, 0);
    tl.set(".kw-box", { scaleX:0 }, 0);
    tl.set("#stat-card", { autoAlpha:0, scale:0.9 }, 0);
    tl.set("#card-shine", { x:-60 }, 0);
    tl.set("#s3-bg-block", { scaleY:0, transformOrigin:"bottom center" }, 0);
    tl.set(["#s3-word","#s3-sub"], { autoAlpha:0, y:60 }, 0);

    // ── STAGE 1: 0–4.5s — words build one by one ──
    tl.to("#s1-eyebrow", { autoAlpha:1, x:0, duration:0.4, ease:"power2.out" }, 0.3);

    var kwIds = ["#kw-hermes","#kw-has","#kw-persistent","#kw-memory","#kw-and","#kw-runs","#kw-locally"];
    kwIds.forEach(function(id, i) {
      tl.to(id, { autoAlpha:1, y:0, duration:0.3, ease:"back.out(2)" }, 0.7 + i * 0.28);
    });

    // Colored boxes sweep under keywords after word appears
    tl.to("#box-hermes", { scaleX:1, duration:0.4, ease:"power2.inOut" }, 1.0);
    tl.to("#kw-hermes",  { color:"#fff", duration:0.2 }, 1.2);

    tl.to("#box-memory",  { scaleX:1, duration:0.4, ease:"power2.inOut" }, 1.84);
    tl.to("#kw-memory",   { color:"#fff", duration:0.2 }, 2.04);

    tl.to("#box-runs",    { scaleX:1, duration:0.4, ease:"power2.inOut" }, 2.40);
    tl.to("#kw-runs",     { color:"#fff", duration:0.2 }, 2.60);

    // All words brighten fully
    tl.to(".kw", { color:"#fff", duration:0.5 }, 2.8);

    // ── TRANSITION 1→2: stage2 scales in at 4.6s ──
    tl.to("#stage1", { autoAlpha:0, duration:0.35, ease:"power2.in" }, 4.4);
    tl.to("#stage2", { autoAlpha:1, duration:0.01 }, 4.55);
    tl.to("#stat-card", { autoAlpha:1, scale:1, duration:0.45, ease:"back.out(1.5)" }, 4.55);
    // Shine sweep across card
    tl.to("#card-shine", { x:960, duration:0.6, ease:"power2.inOut" }, 4.8);

    // ── TRANSITION 2→3: stage3 wipes up at 7.0s ──
    tl.to("#stage2", { autoAlpha:0, duration:0.3, ease:"power2.in" }, 6.8);
    tl.to("#stage3", { autoAlpha:1, duration:0.01 }, 7.0);
    tl.to("#s3-bg-block", { scaleY:1, duration:0.5, ease:"expo.out" }, 7.0);
    tl.to(["#s3-word","#s3-sub"], { autoAlpha:1, y:0, duration:0.4, ease:"expo.out", stagger:0.12 }, 7.3);

    // Word scale pulse
    tl.to("#s3-word", { scale:1.04, duration:0.2, ease:"power2.out", transformOrigin:"center" }, 8.2);
    tl.to("#s3-word", { scale:1, duration:0.25, ease:"power2.inOut" }, 8.4);

    // Fade out
    tl.to("#sc1", { autoAlpha:0, duration:0.5 }, 9.5);

    window.__timelines["demo3"] = tl;
  </script>
</div>
</body>
</html>
